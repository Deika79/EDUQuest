name: eduquest_prod

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile.prod
        image: eduquest/app:prod-local
        restart: unless-stopped
        env_file:
            - .env.production
        ports:
            - '${APP_HTTP_BIND:-127.0.0.1}:${APP_HTTP_PORT:-18080}:80'
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - eduquest

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - eduquest-prod-mysql:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-p${DB_ROOT_PASSWORD}']
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - eduquest

networks:
    eduquest:
        driver: bridge

volumes:
    eduquest-prod-mysql:
        driver: local
